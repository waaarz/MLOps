[project]
name = "ai53-bean-mlops-phase1"
version = "0.2.0"
description = "AI53 MLOps Project Phase 1 - reproducible and traceable image training"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dvc>=3.60,<4",
    "matplotlib>=3.9,<4",
    "mlflow>=3.17,<3.18",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pillow>=11,<13",
    "pyyaml>=6,<7",
    "scikit-learn>=1.6,<2",
    "torch>=2.10,<2.12",
    "torchvision>=0.25,<0.27",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

# The lab uses CPU-only PyTorch wheels from the index below.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
